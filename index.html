<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFY Studio Player</title>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

html, body {
  margin: 0; padding: 0; overflow: hidden; background: #000000; /* Pure Black AMOLED */
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #fff;
}
canvas { position: fixed; inset: 0; z-index: 1; }

#studio-header {
  position: fixed; top: 15px; left: 15px; right: 15px;
  background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  padding: 10px 18px; border-radius: 24px; z-index: 40; display: flex; justify-content: space-between; align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.9); user-select: none; gap: 10px;
}
.brand-title { 
  font-size: 16px; font-weight: 800; color: #fff; cursor: pointer; 
  display: flex; align-items: center; gap: 8px; letter-spacing: 1px; flex-shrink: 0;
}
.brand-title i { color: #00ffcc; filter: drop-shadow(0 0 10px rgba(0,255,204,0.8)); }
.brand-title span { color: #00ffcc; }

.header-center-controls {
  display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center;
}

/* Short Names Dropdown */
.viz-selector-box {
  background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
  color: #00ffcc; border-radius: 16px; padding: 6px 14px; font-size: 11px; font-weight: 700;
  outline: none; cursor: pointer; transition: 0.25s ease; backdrop-filter: blur(15px);
  max-width: 170px; text-overflow: ellipsis;
}
.viz-selector-box:hover, .viz-selector-box:focus {
  background: rgba(0, 255, 204, 0.15); border-color: #00ffcc; color: #fff;
  box-shadow: 0 0 20px rgba(0,255,204,0.4);
}
.viz-selector-box option { background: #050505; color: #fff; font-weight: 600; }

.badge-box { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.badge { background: rgba(255, 255, 255, 0.05); padding: 6px 14px; border-radius: 14px; font-size: 11px; font-weight: 600; color: #aaa; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 6px; }

.live-tower-icon { color: #ff4757; animation: redTowerGlow 1.8s infinite ease-in-out; }
@keyframes redTowerGlow {
  0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,71,87,0.4)); }
  50% { transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(255,71,87,0.9)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,71,87,0.4)); }
}

.live-dot { width: 9px; height: 9px; background: #ff4757; border-radius: 50%; box-shadow: 0 0 10px #ff4757; transition: 0.3s; }
.live-dot.active { background: #ff4757; box-shadow: 0 0 14px #ff4757; }

/* Glassmorphic Modals */
#studio-modal, #auth-modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 100;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
}
.studio-container {
  background: linear-gradient(180deg, rgba(12, 12, 18, 0.98) 0%, rgba(0, 0, 0, 1) 100%);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  width: 94%; max-width: 440px; height: 90vh;
  border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 36px; padding: 20px;
  box-shadow: 0 30px 100px rgba(0,0,0,0.95); display: flex; flex-direction: column; gap: 14px;
  position: relative; overflow: hidden;
}
.auth-container {
  background: rgba(12, 12, 18, 0.95); backdrop-filter: blur(30px);
  width: 90%; max-width: 360px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px; padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.95); display: flex; flex-direction: column; gap: 16px;
}
.studio-title, .auth-title { font-size: 18px; color: #fff; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }

/* Category Chips */
.category-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.category-chips::-webkit-scrollbar { display: none; }
.chip { 
  background: rgba(255, 255, 255, 0.05); padding: 8px 18px; border-radius: 30px; font-size: 12px; font-weight: 700; 
  color: #a0a0b8; border: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer; white-space: nowrap; transition: 0.25s ease; 
}
.chip.active, .chip:hover { background: linear-gradient(135deg, #00b894, #00cec9); color: #000; border-color: transparent; box-shadow: 0 4px 15px rgba(0,206,201,0.4); }

/* Search Bar */
.search-box-wrapper { display: flex; gap: 8px; align-items: center; width: 100%; }
input[type="text"], input[type="password"] {
  flex: 1; padding: 12px 16px; background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 20px; outline: none; font-size: 13px; font-weight: 600;
  transition: 0.25s ease;
}
input[type="text"]:focus, input[type="password"]:focus { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.3); }

button.search-btn-custom {
  background: linear-gradient(135deg, #00b894, #00cec9); color: #000; border: none; padding: 12px 18px;
  font-size: 13px; font-weight: 700; border-radius: 20px; cursor: pointer; transition: 0.25s ease;
  box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4); display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}

#controls {
  position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
  z-index: 30; display: none;
}
#live-btn {
  background: linear-gradient(135deg, #00ffcc, #00b894); padding: 16px 44px; font-size: 14px; border-radius: 50px;
  box-shadow: 0 10px 40px rgba(0, 255, 204, 0.5); color: #000; font-weight: 800; cursor: pointer; border: none;
}

.section-heading { font-size: 13px; color: #00ffcc; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }

.slideshow-container {
  position: relative; width: 100%; height: 175px; overflow: hidden; border-radius: 24px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 15px 35px rgba(0,0,0,0.8);
}
.slideshow-track { display: flex; height: 100%; transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1); cursor: grab; }
.slideshow-track:active { cursor: grabbing; }

.slide-banner-card {
  min-width: 100%; height: 100%; box-sizing: border-box; position: relative; overflow: hidden; flex-shrink: 0;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; cursor: pointer;
  border: none !important;
}
.slide-banner-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transition: transform 0.5s ease; }
.slide-banner-card:hover img { transform: scale(1.05); }

.slide-banner-card .black-shadow-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.92) 85%, rgba(0,0,0,1) 100%);
  z-index: 2;
}

.slide-banner-card .banner-info { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 3px; }
.slide-banner-card .banner-title { font-size: 15px; font-weight: 800; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slide-banner-card .banner-sub { font-size: 11px; color: #aaa; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,0.8); }

.slideshow-dots { display: flex; justify-content: center; gap: 6px; margin-top: 4px; }
.slide-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; }
.slide-dot.active { width: 20px; border-radius: 4px; background: #00ffcc; box-shadow: 0 0 8px rgba(0,255,204,0.8); }

#playlist-picker-modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 200;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(20px);
}
.playlist-picker-box {
  background: #0a0a0f; border: 1px solid rgba(255,255,255,0.15); width: 85%; max-width: 320px;
  border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.9);
}

.item-card {
  background: rgba(255, 255, 255, 0.03); padding: 10px 14px; border-radius: 20px;
  display: flex; flex-direction: column; gap: 6px; border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 8px; transition: 0.2s;
}
.item-card:hover { border-color: rgba(0, 255, 204, 0.4); background: rgba(255, 255, 255, 0.05); }
.item-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }

.item-card.on-air-row { background: rgba(255, 71, 87, 0.06); border-color: rgba(255,71,87,0.3); }

.album-art { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
.item-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.item-title { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-artist { font-size: 10px; color: #888899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.round-preview-btn {
  width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.08); color: #fff;
  border: none; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; transition: 0.2s;
}
.round-preview-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 12px rgba(0,255,204,0.6); }

.save-btn { background: #00ffcc; color: #000; border: none; padding: 6px 12px; font-size: 10px; font-weight: 800; border-radius: 16px; cursor: pointer; }
.delete-btn { background: rgba(255,71,87,0.2); color: #ff4757; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.bottom-nav-bar {
  display: flex; justify-content: space-around; align-items: center;
  background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 35px;
  width: 190px; margin: auto auto 0 auto; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.nav-item { color: rgba(255,255,255,0.4); font-size: 16px; cursor: pointer; transition: 0.2s; }
.nav-item.active, .nav-item:hover { color: #00ffcc; transform: scale(1.15); }

#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #00ffcc; color: #000; padding: 12px 28px; border-radius: 30px;
  font-size: 13px; font-weight: 800; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  transition: transform 0.35s ease, opacity 0.3s ease; opacity: 0; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.dev-sig { height: 14px; line-height: 14px; font-size: 9px; color: rgba(255,255,255,0.25); text-align: center; letter-spacing: 1.5px; text-transform: uppercase; margin-top: auto; font-weight: 700; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="studio-header">
  <div class="brand-title" id="brand-title">
    <i class="fa-solid fa-compact-disc fa-spin" style="--fa-animation-duration: 6s;"></i> <span>VFY</span> <small style="font-size:9px; color:rgba(255,255,255,0.3);">(3x)</small>
  </div>

  <div class="header-center-controls">
    <select id="viz-mode-select" class="viz-selector-box" onchange="changeVisualizerMode(this.value)">
      <option value="1">1. Flower</option>
      <option value="2">2. Plasma Wave</option>
      <option value="3">3. Space Drift</option>
      <option value="4">4. Laser Ring</option>
    </select>
  </div>

  <div class="badge-box">
    <div class="badge"><i class="fa-solid fa-tower-broadcast live-tower-icon"></i> Live</div>
    <div class="live-dot" id="live-dot"></div>
  </div>
</div>

<div id="controls">
  <button id="live-btn" onclick="startLiveAudio()"><i class="fa-solid fa-play"></i> TAP TO START LIVE FM</button>
</div>

<!-- Password Modal -->
<div id="auth-modal">
  <div class="auth-container">
    <div class="auth-title">
      <span><i class="fa-solid fa-shield-halved"></i> Admin Access</span>
      <button onclick="closeAuthModal()" style="background:rgba(255,255,255,0.06); padding:6px 12px; font-size:12px; border:none; color:#fff; border-radius:10px;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <input type="password" id="admin-pass-input" placeholder="Enter password..." onkeydown="if(event.key==='Enter') verifyAdminPassword()">
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button onclick="closeAuthModal()" style="background:rgba(255,255,255,0.06); border:none; color:#fff; padding:10px 16px; border-radius:12px; cursor:pointer;">Cancel</button>
      <button onclick="verifyAdminPassword()" style="background:linear-gradient(135deg, #00b894, #00cec9); color:#000; border:none; padding:10px 18px; border-radius:12px; font-weight:700; cursor:pointer;">Login</button>
    </div>
  </div>
</div>

<!-- Playlist Picker Modal -->
<div id="playlist-picker-modal">
  <div class="playlist-picker-box">
    <div style="font-size:14px; font-weight:800; display:flex; justify-content:space-between; align-items:center;">
      <span><i class="fa-solid fa-folder-plus"></i> Select Playlist</span>
      <button onclick="closePlaylistPicker()" style="background:none; border:none; color:#aaa; font-size:14px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div style="font-size:11px; color:#aaa;">Choose which playlist category to save this track into:</div>
    <div id="playlist-options-container" style="display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto;"></div>
    <div style="display:flex; gap:6px; margin-top:4px;">
      <input type="text" id="new-category-input" placeholder="Or new category name..." style="font-size:11px; padding:8px 12px;">
      <button onclick="createNewCategoryAndSave()" style="background:#00ffcc; color:#000; border:none; border-radius:14px; padding:8px 12px; font-size:11px; font-weight:700; cursor:pointer;">Add</button>
    </div>
  </div>
</div>

<!-- Master Studio Console Modal -->
<div id="studio-modal">
  <div class="studio-container">
    <div class="studio-title">
      <span><i class="fa-solid fa-sliders"></i> VFY Studio</span>
      <button onclick="closeStudio()" style="background:rgba(255,255,255,0.06); padding:6px 12px; font-size:12px; border:none; color:#fff; border-radius:10px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Category Chips -->
    <div class="category-chips" id="category-chips-container">
      <div class="chip active" onclick="filterTab('All', this)">All</div>
      <div class="chip" onclick="filterTab('Hindi', this)">Hindi</div>
      <div class="chip" onclick="filterTab('Bhojpuri', this)">Bhojpuri</div>
      <div class="chip" onclick="filterTab('Bhakti', this)">Bhakti</div>
      <div class="chip" onclick="filterTab('Punjabi', this)">Punjabi</div>
    </div>

    <!-- Search Box -->
    <div class="search-box-wrapper">
      <input type="text" id="query-input" placeholder="Search track or artist name..." onkeydown="if(event.key==='Enter') document.getElementById('search-btn').click()">
      <button id="search-btn" class="search-btn-custom"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
    </div>

    <!-- Search Results Container -->
    <div id="search-results" style="max-height:120px; overflow-y:auto; padding-right:4px;"></div>

    <div class="section-heading">
      <span><i class="fa-solid fa-tower-broadcast live-tower-icon"></i> Live Featured Station (Slideshow)</span>
    </div>
    
    <!-- Full Width Slideshow Container -->
    <div class="slideshow-container" id="slideshow-container">
      <div class="slideshow-track" id="slideshow-track"></div>
    </div>
    <div class="slideshow-dots" id="slideshow-dots"></div>

    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:8px; display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <div class="section-heading">
        <span><i class="fa-solid fa-list-ul"></i> Trending Queue (Full Playlist)</span>
      </div>
      <div id="playlist-container" style="overflow-y:auto; font-size:13px; color:#aaa; flex:1; padding-right:4px;">Loading queue...</div>
    </div>
    
    <!-- Bottom 3 Icons Bar -->
    <div class="bottom-nav-bar">
      <div class="nav-item active" title="Home"><i class="fa-solid fa-house"></i></div>
      <div class="nav-item" title="Queue"><i class="fa-solid fa-music"></i></div>
      <div class="nav-item" title="Profile"><i class="fa-solid fa-user"></i></div>
    </div>

    <div class="dev-sig">DEVELOPER VIVEKMASONA</div>
  </div>
</div>

<div id="toast">Track saved successfully!</div>

<audio id="audio-element" crossorigin="anonymous" controlslist="nodownload noplaybackrate" disablepictureinpicture></audio>
<audio id="preview-audio"></audio>

<script>
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
var w = canvas.width = window.innerWidth;
var h = canvas.height = window.innerHeight;

window.onresize = function() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
};

var npt = 0, nrt = 0;
var config = { centerImage: "https://i.imgur.com/8Q5N8bB.png" };

var bgImage = new Image();
bgImage.src = config.centerImage;

var AudioContext = window.AudioContext || window.webkitAudioContext;
var actx, analyser, gainNode, sourceNode, frequencyData, frequencyDataLen;
var playing = false;
var audioEl = document.getElementById("audio-element");
var previewAudio = document.getElementById("preview-audio");
const liveDot = document.getElementById("live-dot");

let activePreviewUrl = null;
let currentTabCategory = 'All';
let pendingSongToSave = null;
let customCategories = ['Hindi', 'Bhojpuri', 'Bhakti', 'Punjabi'];

let activeVizMode = parseInt(localStorage.getItem('vfy_viz_mode') || '1', 10);

function initVisualizerDropdown() {
  document.getElementById("viz-mode-select").value = activeVizMode;
}

function changeVisualizerMode(val) {
  activeVizMode = parseInt(val, 10);
  localStorage.setItem('vfy_viz_mode', activeVizMode);
  showToast(`Mode ${activeVizMode} Selected`);
}

function loadLocalPlaylists() {
  const savedCats = localStorage.getItem('vfy_categories');
  if (savedCats) {
    try { customCategories = JSON.parse(savedCats); } catch(e){}
  }
  renderCategoryChips();
}

function renderCategoryChips() {
  const container = document.getElementById("category-chips-container");
  let html = `<div class="chip ${currentTabCategory === 'All' ? 'active' : ''}" onclick="filterTab('All', this)">All</div>`;
  customCategories.forEach(cat => {
    html += `<div class="chip ${currentTabCategory === cat ? 'active' : ''}" onclick="filterTab('${cat}', this)">${cat}</div>`;
  });
  container.innerHTML = html;
}

function initAudioContext() {
  if (!actx && AudioContext) {
    actx = new AudioContext();
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;
    
    gainNode = actx.createGain();

    sourceNode = actx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(gainNode);
    gainNode.connect(actx.destination);

    frequencyDataLen = analyser.frequencyBinCount;
    frequencyData = new Uint8Array(frequencyDataLen);
  }
  if (actx && actx.state === 'suspended') { actx.resume(); }
}

let globalPlaylist = [];
let activeIndex = -1;
let syncTimeout = null;

let tapCount = 0;
let tapTimer = null;
const brandTitle = document.getElementById("brand-title");

brandTitle.addEventListener('click', () => {
  tapCount++;
  if (tapCount === 3) {
    document.getElementById("auth-modal").style.display = "flex";
    document.getElementById("admin-pass-input").value = "";
    document.getElementById("admin-pass-input").focus();
    tapCount = 0;
  }
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 800);
});

function closeAuthModal() { document.getElementById("auth-modal").style.display = "none"; }

function verifyAdminPassword() {
  const pass = document.getElementById("admin-pass-input").value;
  if (pass === "vivekbabu") {
    closeAuthModal();
    loadLocalPlaylists();
    document.getElementById("studio-modal").style.display = "flex";
    renderPlaylistUI();
    renderSlideshowBanners();
  } else {
    alert("Wrong Password!");
    document.getElementById("admin-pass-input").value = "";
  }
}

function closeStudio() { stopPreview(); document.getElementById("studio-modal").style.display = "none"; }

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.innerText = message;
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); }, 2500);
}

function filterTab(category, el) {
  currentTabCategory = category;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderPlaylistUI();
}

function pollGlobalState() {
  const fetchStartTime = Date.now();
  fetch('/api/playlist')
    .then(res => res.json())
    .then(data => {
      globalPlaylist = Array.isArray(data.playlist) ? data.playlist : [];
      let newIndex = data.currentIndex || 0;
      let seekTime = data.seekTime || 0;
      let sTime = data.serverTime || fetchStartTime;
      
      if (document.getElementById("studio-modal").style.display === "flex") {
        renderPlaylistUI();
        renderSlideshowBanners();
      }

      if (globalPlaylist.length > 0) {
        document.getElementById("controls").style.display = "none";
        activeIndex = newIndex;
        playSongAtIndex(activeIndex, seekTime, sTime);
      } else {
        document.getElementById("controls").style.display = "flex";
        liveDot.classList.remove("active");
      }
      scheduleNextSync();
    })
    .catch(err => {
      console.error("Sync error:", err);
      document.getElementById("controls").style.display = "flex";
      liveDot.classList.remove("active");
      syncTimeout = setTimeout(pollGlobalState, 10000);
    });
}

function scheduleNextSync() {
  if (syncTimeout) clearTimeout(syncTimeout);
  if (audioEl.duration && !isNaN(audioEl.duration)) {
    let remainingTimeMs = Math.max(2000, (audioEl.duration - audioEl.currentTime) * 1000);
    syncTimeout = setTimeout(pollGlobalState, remainingTimeMs);
  } else {
    syncTimeout = setTimeout(pollGlobalState, 30000);
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { pollGlobalState(); }
});

function renderPlaylistUI() {
  const container = document.getElementById("playlist-container");
  if (globalPlaylist.length === 0) {
    container.innerHTML = "No tracks in queue.";
    return;
  }

  let filteredList = globalPlaylist.filter(song => {
    if (currentTabCategory === 'All') return true;
    return song.category === currentTabCategory;
  });

  if (filteredList.length === 0 && currentTabCategory !== 'All') {
    container.innerHTML = `<div style="padding:10px; color:#777;">No tracks found in ${currentTabCategory} category.</div>`;
    return;
  }

  let html = "";
  (filteredList.length > 0 ? filteredList : globalPlaylist).forEach((song) => {
    let globalIndex = globalPlaylist.indexOf(song);
    let isOnAir = (globalIndex === activeIndex);
    let cardClass = isOnAir ? "item-card on-air-row" : "item-card";

    html += `
      <div class="${cardClass}" onclick="adminSelectSong(${globalIndex})">
        <div class="item-row">
          <img src="${song.image || config.centerImage}" class="album-art">
          <div class="item-info">
            <div class="item-title">${isOnAir ? '<i class="fa-solid fa-tower-broadcast live-tower-icon"></i> [ON AIR] ' : ''}${song.title}</div>
            <div class="item-artist">${song.primaryArtists || 'VFY Artist'} • <span style="color:#00ffcc;">${song.category || 'All'}</span></div>
          </div>
          <button class="delete-btn" onclick="event.stopPropagation(); deleteGlobalSong(${globalIndex})"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

let currentSlideIndex = 0;

function renderSlideshowBanners() {
  const trackContainer = document.getElementById("slideshow-track");
  const dotsContainer = document.getElementById("slideshow-dots");
  
  if (globalPlaylist.length === 0) {
    trackContainer.innerHTML = "<div style='font-size:11px; color:#666; padding:20px; text-align:center;'>No banner tracks available.</div>";
    dotsContainer.innerHTML = "";
    return;
  }

  if (activeIndex >= 0 && activeIndex < globalPlaylist.length) {
    currentSlideIndex = activeIndex;
  }

  let slidesHtml = "";
  let dotsHtml = "";
  
  globalPlaylist.forEach((song, idx) => {
    let isOnAir = (idx === activeIndex);

    slidesHtml += `
      <div class="slide-banner-card" onclick="adminSelectSong(${idx})">
        <img src="${song.image || config.centerImage}">
        <div class="black-shadow-overlay"></div>
        <div class="banner-info">
          <div class="banner-title">${isOnAir ? '<i class="fa-solid fa-tower-broadcast live-tower-icon"></i> [ON AIR] ' : ''}${song.title}</div>
          <div class="banner-sub">${song.primaryArtists || 'Featured Live Artist'} • <span style="color:#00ffcc;">${song.category || 'General'}</span></div>
        </div>
      </div>
    `;
    dotsHtml += `<div class="slide-dot ${idx === currentSlideIndex ? 'active' : ''}" onclick="currentSlide(${idx})"></div>`;
  });

  trackContainer.innerHTML = slidesHtml;
  dotsContainer.innerHTML = dotsHtml;
  updateSlideshowPosition();
}

function currentSlide(idx) {
  currentSlideIndex = idx;
  updateSlideshowPosition();
}

function updateSlideshowPosition() {
  const trackContainer = document.getElementById("slideshow-track");
  if (trackContainer) {
    trackContainer.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
  }
  const dots = document.querySelectorAll(".slide-dot");
  dots.forEach((dot, i) => {
    if (i === currentSlideIndex) dot.classList.add("active");
    else dot.classList.remove("active");
  });
}

let touchStartX = 0;
const slideshowEl = document.getElementById("slideshow-container");
if (slideshowEl) {
  slideshowEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
  slideshowEl.addEventListener('touchend', e => {
    let diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 30) {
      if (diff > 0) { currentSlideIndex = (currentSlideIndex - 1 + globalPlaylist.length) % globalPlaylist.length; }
      else { currentSlideIndex = (currentSlideIndex + 1) % globalPlaylist.length; }
      currentSlide(currentSlideIndex);
    }
  }, {passive: true});
}

function adminSelectSong(index) {
  fetch('/api/play', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: index })
  })
  .then(res => res.json())
  .then(data => {
    globalPlaylist = data.playlist;
    activeIndex = data.currentIndex;
    playSongAtIndex(activeIndex, data.seekTime, data.serverTime);
    renderPlaylistUI();
    renderSlideshowBanners();
    scheduleNextSync();
  });
}

function deleteGlobalSong(index) {
  if (!confirm("Delete track?")) return;
  fetch(`/api/playlist/${index}`, { method: 'DELETE' })
    .then(res => res.json())
    .then(data => {
      globalPlaylist = data.playlist;
      activeIndex = data.currentIndex;
      if (globalPlaylist.length > 0) {
        playSongAtIndex(activeIndex, data.seekTime, data.serverTime);
      } else {
        audioEl.pause();
        audioEl.src = "";
        playing = false;
        liveDot.classList.remove("active");
        document.getElementById("controls").style.display = "flex";
      }
      renderPlaylistUI();
      renderSlideshowBanners();
      scheduleNextSync();
    });
}

document.getElementById("search-btn").addEventListener("click", () => {
  const query = document.getElementById("query-input").value.trim();
  if (!query) return;

  const resultsContainer = document.getElementById("search-results");
  resultsContainer.innerHTML = "<div style='font-size:12px; color:#888; padding:6px;'>Searching...</div>";

  fetch(`/api/search?q=${encodeURIComponent(query)}`)
    .then(res => res.json())
    .then(data => {
      const songs = data.results || [];
      if (songs.length === 0) {
        resultsContainer.innerHTML = "<div style='font-size:12px; color:#888; padding:6px;'>No tracks found.</div>";
        return;
      }

      let html = "";
      songs.forEach((s, idx) => {
        const songObj = encodeURIComponent(JSON.stringify(s));
        html += `
          <div class="item-card">
            <div class="item-row">
              <img src="${s.image || config.centerImage}" class="album-art">
              <div class="item-info">
                <div class="item-title">${s.title}</div>
                <div class="item-artist">${s.primaryArtists}</div>
              </div>
              <div style="display:flex; gap:6px; align-items:center;">
                <button class="round-preview-btn" id="prev-btn-${idx}" onclick="toggleSearchPreview('${s.url}', 'prev-btn-${idx}')"><i class="fa-solid fa-play"></i></button>
                <button class="save-btn" onclick="openPlaylistPicker('${songObj}')">+ Save to...</button>
              </div>
            </div>
          </div>
        `;
      });
      resultsContainer.innerHTML = html;
    })
    .catch(err => { resultsContainer.innerHTML = "<div style='font-size:12px; color:#ff4757;'>Search Error.</div>"; });
});

function toggleSearchPreview(url, btnId) {
  const btn = document.getElementById(btnId);
  const icon = btn.querySelector("i");
  if (activePreviewUrl === url && !previewAudio.paused) {
    previewAudio.pause();
    icon.className = "fa-solid fa-play";
  } else {
    audioEl.muted = true;
    previewAudio.src = url;
    previewAudio.play().then(() => {
      activePreviewUrl = url;
      icon.className = "fa-solid fa-pause";
    }).catch(err => { audioEl.muted = false; alert("Preview failed"); });
  }
}

previewAudio.onended = () => { stopPreview(); };

function stopPreview() {
  previewAudio.pause();
  previewAudio.currentTime = 0;
  audioEl.muted = false;
  activePreviewUrl = null;
}

function openPlaylistPicker(encodedObj) {
  pendingSongToSave = encodedObj;
  const container = document.getElementById("playlist-options-container");
  let html = "";
  customCategories.forEach(cat => {
    html += `<button onclick="confirmSaveToCategory('${cat}')" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px 14px; border-radius:14px; text-align:left; font-weight:700; font-size:12px; cursor:pointer;"><i class="fa-solid fa-folder"></i> ${cat}</button>`;
  });
  container.innerHTML = html;
  document.getElementById("playlist-picker-modal").style.display = "flex";
}

function closePlaylistPicker() {
  document.getElementById("playlist-picker-modal").style.display = "none";
  pendingSongToSave = null;
}

function createNewCategoryAndSave() {
  const input = document.getElementById("new-category-input");
  const newCat = input.value.trim();
  if (!newCat) return;
  if (!customCategories.includes(newCat)) {
    customCategories.push(newCat);
    localStorage.setItem('vfy_categories', JSON.stringify(customCategories));
    renderCategoryChips();
  }
  input.value = "";
  confirmSaveToCategory(newCat);
}

function confirmSaveToCategory(categoryName) {
  if (!pendingSongToSave) return;
  const songData = JSON.parse(decodeURIComponent(pendingSongToSave));
  songData.duration = Number(songData.duration) || 180;
  songData.category = categoryName;

  fetch('/api/playlist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(songData)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      globalPlaylist = data.playlist;
      closePlaylistPicker();
      renderPlaylistUI();
      renderSlideshowBanners();
      scheduleNextSync();
      showToast(`✓ Added to ${categoryName} playlist!`);
    }
  })
  .catch(err => { showToast("❌ Error saving track."); });
}

window.addEventListener('load', () => { 
  initVisualizerDropdown();
  loadLocalPlaylists();
  autoPlayLiveRadio(); 
});

function autoPlayLiveRadio() {
  initAudioContext();
  fetch('/api/playlist')
    .then(res => res.json())
    .then(data => {
      globalPlaylist = Array.isArray(data.playlist) ? data.playlist : [];
      if (globalPlaylist.length === 0) return;
      activeIndex = data.currentIndex || 0;
      playSongAtIndex(activeIndex, data.seekTime || 0, data.serverTime || Date.now());
      scheduleNextSync();
    })
    .catch(err => { document.getElementById("controls").style.display = "block"; });
}

function startLiveAudio() {
  document.getElementById("controls").style.display = "none";
  autoPlayLiveRadio();
}

function setupMediaSession(song) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title || "VFY FM Live",
      artist: song.primaryArtists || "VFY Artist",
      album: song.category || "VFY Studio",
      artwork: [
        { src: song.image || config.centerImage, sizes: '96x96', type: 'image/jpeg' },
        { src: song.image || config.centerImage, sizes: '128x128', type: 'image/jpeg' },
        { src: song.image || config.centerImage, sizes: '192x192', type: 'image/jpeg' },
        { src: song.image || config.centerImage, sizes: '512x512', type: 'image/jpeg' }
      ]
    });

    navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); });
    navigator.mediaSession.setActionHandler('pause', () => { audioEl.pause(); });
  }
}

function playSongAtIndex(index, baseSeekTime, serverTimestamp) {
  if (globalPlaylist.length === 0) return;
  activeIndex = index % globalPlaylist.length;
  const song = globalPlaylist[activeIndex];

  if (!song || !song.url) return;
  if (song.image) { bgImage.src = song.image; }

  setupMediaSession(song);
  renderSlideshowBanners();
  renderPlaylistUI();

  const networkDelay = (Date.now() - serverTimestamp) / 1000;
  const exactTargetSeek = baseSeekTime + Math.max(0, networkDelay);

  if (audioEl.src !== song.url) {
    audioEl.src = song.url;
    audioEl.currentTime = exactTargetSeek;
  } else {
    if (Math.abs(audioEl.currentTime - exactTargetSeek) > 0.6) {
      audioEl.currentTime = exactTargetSeek;
    }
  }

  audioEl.play().then(() => {
    document.getElementById("controls").style.display = "none";
    liveDot.classList.add("active");
    if (!playing) {
      playing = true;
      render();
    }
  }).catch(err => {
    document.getElementById("controls").style.display = "block";
    liveDot.classList.remove("active");
  });
}

// -------------------------------------------------------------
// 4 ULTIMATE FULL-SCREEN AMOLED VISUALIZERS (SMOOTH & CINEMATIC)
// -------------------------------------------------------------
function clearCanvas(){
  if(activeVizMode === 2) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
  } else {
    ctx.fillStyle = "#000000"; // Pure Black True AMOLED
  }
  ctx.fillRect(0, 0, w, h);
}

function getBassPulse() { 
  if (!frequencyData) return 0; 
  let bassSum = 0; 
  for (let i = 0; i < 6; i++) { bassSum += frequencyData[i]; } 
  let currentVolume = audioEl.volume;
  return (bassSum / 6) * currentVolume; 
}

function drawCenterAlbumArt(bassPower) {
  const dynamicZoom = Math.min(w, h) * 0.15 + (bassPower * 0.15);
  if (bgImage.complete && bgImage.src) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, dynamicZoom, 0, Math.PI * 2);
    ctx.shadowColor = "#00ffcc";
    ctx.shadowBlur = 30 + (bassPower * 0.4);
    ctx.strokeStyle = "rgba(0, 255, 204, 0.9)";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.clip();
    ctx.drawImage(bgImage, (w / 2) - dynamicZoom, (h / 2) - dynamicZoom, dynamicZoom * 2, dynamicZoom * 2);
    ctx.restore();
  }
}

var spaceDriftStars = [];
for(let i=0; i<80; i++) {
  spaceDriftStars.push({
    angle: Math.random() * Math.PI * 2,
    dist: Math.random() * (window.innerWidth * 0.5),
    speed: Math.random() * 0.6 + 0.3,
    size: Math.random() * 2 + 1
  });
}

function render() {
  if (!playing) return;
  if (analyser) analyser.getByteFrequencyData(frequencyData);

  clearCanvas();
  npt += 0.012;
  nrt += 0.006;

  const bass = getBassPulse();

  switch(activeVizMode) {
    case 1: drawViz1_Flower(bass); break;
    case 2: drawViz2_Plasma(bass); break;
    case 3: drawViz3_SpaceDrift(bass); break;
    case 4: drawViz4_LaserRing(bass); break;
    default: drawViz1_Flower(bass); break;
  }

  drawCenterAlbumArt(bass);
  requestAnimationFrame(render);
}

// 1. Flower (WMP Alchemy Kaleidoscopic Petals)
function drawViz1_Flower(bass) {
  const petals = 8;
  const maxRadius = Math.min(w, h) * 0.48;
  ctx.save();
  ctx.translate(w / 2, h / 2);
  for (let p = 0; p < petals; p++) {
    ctx.rotate((Math.PI * 2) / petals);
    ctx.beginPath();
    let firstPoint = true;
    for (let i = 0; i < frequencyDataLen; i += 2) {
      const val = frequencyData[i];
      const angle = (i / frequencyDataLen) * Math.PI;
      const radius = 90 + (val / 255) * (maxRadius - 90) + Math.sin(npt + i * 0.1) * bass * 0.4;
      const x = Math.cos(angle + nrt) * radius;
      const y = Math.sin(angle * 2 + nrt) * (radius * 0.8);
      if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; } else { ctx.lineTo(x, y); }
    }
    const hue = (p * (360 / petals) + npt * 40) % 360;
    ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.85)`;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 25;
    ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.8)`;
    ctx.stroke();
  }
  ctx.restore();
}

// 2. Plasma Wave (Smooth Full-Screen Fluid Waves)
function drawViz2_Plasma(bass) {
  ctx.save();
  for (let line = 0; line < 6; line++) {
    ctx.beginPath();
    for (let x = 0; x < w; x += 10) {
      const idx = Math.floor((x / w) * frequencyDataLen);
      const val = frequencyData[idx] || 0;
      const y = (h / 2) + Math.sin(x * 0.007 + npt * 2.5 + line * 0.4) * (val * 0.9 + bass * 0.6) + (line * 35 - 90);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    const hue = (line * 60 + npt * 35) % 360;
    ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.8)`;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 20;
    ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.7)`;
    ctx.stroke();
  }
  ctx.restore();
}

// 3. Space Drift (Smooth Center-Outward Calm Drift with Edge Fade)
function drawViz3_SpaceDrift(bass) {
  ctx.save();
  ctx.translate(w / 2, h / 2);
  const maxRadius = Math.max(w, h) * 0.48;

  spaceDriftStars.forEach((star, idx) => {
    const val = frequencyData[idx % frequencyDataLen] || 0;
    star.dist += star.speed + (bass * 0.15) + (val * 0.03);

    if (star.dist > maxRadius) {
      star.dist = 30; // reset near center
      star.angle = Math.random() * Math.PI * 2;
    }

    const x = Math.cos(star.angle) * star.dist;
    const y = Math.sin(star.angle) * star.dist;

    // Smooth fade out as it reaches the edges
    let opacity = 1 - (star.dist / maxRadius);
    opacity = Math.max(0, opacity);

    ctx.beginPath();
    ctx.arc(x, y, star.size + (val/255)*1.5, 0, Math.PI * 2);
    const hue = (idx * 12 + npt * 20) % 360;
    ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${opacity})`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsla(${hue}, 100%, 50%, ${opacity})`;
    ctx.fill();
  });
  ctx.restore();
}

// 4. Laser Ring (Center Origin Calm Pulsing Rings with Outer Fade)
function drawViz4_LaserRing(bass) {
  ctx.save();
  ctx.translate(w / 2, h / 2);
  const rings = 5;
  const maxRadius = Math.max(w, h) * 0.48;

  for (let r = 1; r <= rings; r++) {
    const val = frequencyData[r * 15] || 0;
    let radius = (( (npt * 40 + r * 80) % maxRadius )) + (bass * 0.3) + (val * 0.15);
    if (radius > maxRadius) radius = 30;

    let opacity = 1 - (radius / maxRadius);
    opacity = Math.max(0, opacity);

    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    const hue = (r * 70 + npt * 30) % 360;
    ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${opacity})`;
    ctx.lineWidth = 2.5;
    ctx.shadowBlur = 18;
    ctx.shadowColor = `hsla(${hue}, 100%, 50%, ${opacity})`;
    ctx.stroke();
  }
  ctx.restore();
}

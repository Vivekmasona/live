<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFY Studio FM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden; background: #07050f;
  font-family: 'Plus Jakarta Sans', sans-serif; color: #fff;
}
canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

#main-app {
  position: relative; width: 100%; height: 100%; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 14px; box-sizing: border-box; max-width: 480px; margin: 0 auto;
}

/* Stylish Header */
.stylish-header {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(18, 14, 32, 0.75); backdrop-filter: blur(20px);
  padding: 10px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
  position: relative; z-index: 60;
}
.brand-title { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.brand-title span { color: #8c7ae6; }

.search-toggle-btn {
  width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8c7ae6;
  border: 1px solid rgba(255,255,255,0.1);
}

/* In-Header Dropdown Search Box */
.search-dropdown {
  position: absolute; top: 65px; left: 0; right: 0;
  background: rgba(16, 12, 30, 0.98); backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 14px;
  z-index: 55; display: none; flex-direction: column; gap: 10px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.8); max-height: 70vh; overflow-y: auto;
}
.search-dropdown.open { display: flex; }

.search-box-wrapper { display: flex; gap: 6px; width: 100%; }
input[type="text"], input[type="password"] {
  flex: 1; padding: 10px 14px; background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; border-radius: 14px; outline: none; font-size: 12px;
}
button.btn-main {
  background: linear-gradient(135deg, #4834d4, #686de0); color: white; border: none; padding: 8px 14px;
  font-size: 11px; font-weight: 700; border-radius: 14px; cursor: pointer;
}

/* 4 Items per Line Square Grid for Search Results */
.search-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px;
}
.grid-card {
  background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
}
.grid-card img {
  width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px;
}
.grid-title { font-size: 9px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.grid-actions { display: flex; gap: 4px; width: 100%; justify-content: center; }

/* Category Chips */
.category-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.category-chips::-webkit-scrollbar { display: none; }
.chip { 
  background: rgba(255, 255, 255, 0.06); padding: 7px 16px; border-radius: 30px; font-size: 11px; font-weight: 700; 
  color: #a0a0b8; border: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer; white-space: nowrap; 
}
.chip.active, .chip:hover { background: linear-gradient(135deg, #4834d4, #686de0); color: #fff; }

/* Slide Show */
.slideshow-wrapper { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.slideshow-wrapper::-webkit-scrollbar { display: none; }
.slide-card {
  min-width: 82%; height: 160px; border-radius: 20px; overflow: hidden; position: relative;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; scroll-snap-align: start;
}
.slide-card img { width: 100%; height: 100%; object-fit: cover; }
.slide-overlay {
  position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.9) 100%);
  display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box;
}

.live-ripple-badge {
  display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 20px; width: fit-content; border: 1px solid rgba(255,71,87,0.4);
}
.ripple-tower { position: relative; width: 10px; height: 10px; display: flex; align-items: center; justify-content: center; }
.ripple-tower .core { width: 5px; height: 5px; background: #ff4757; border-radius: 50%; box-shadow: 0 0 6px #ff4757; }
.ripple-tower .wave { position: absolute; width: 100%; height: 100%; border: 2px solid #ff4757; border-radius: 50%; animation: ripple 1.5s infinite ease-out; }
@keyframes ripple { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }

.section-heading { font-size: 11px; color: #8c7ae6; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; margin: 2px 0; }

.item-card {
  background: rgba(255, 255, 255, 0.03); padding: 8px 12px; border-radius: 16px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 6px;
}
.album-art { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
.item-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.item-title { font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-artist { font-size: 10px; color: #9999b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Bottom Capsule Bar */
.bottom-nav-bar {
  display: flex; justify-content: space-around; align-items: center;
  background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12); padding: 6px 14px; border-radius: 35px;
  width: 200px; margin: 0 auto; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
.nav-item { color: rgba(255,255,255,0.4); font-size: 15px; cursor: pointer; transition: 0.2s; }
.nav-item.active, .nav-item:hover { color: #8c7ae6; }

.center-disk-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid #8c7ae6;
  overflow: hidden; cursor: pointer; animation: spin 8s linear infinite; animation-play-state: paused;
}
.center-disk-btn.playing { animation-play-state: running; }
.center-disk-btn img { width: 100%; height: 100%; object-fit: cover; }
@keyframes spin { 100% { transform: rotate(360deg); } }

#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #6c5ce7; color: #fff; padding: 10px 24px; border-radius: 30px;
  font-size: 12px; font-weight: 800; z-index: 1000; transition: 0.3s; opacity: 0; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Admin Password Modal -->
<div id="auth-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:none; align-items:center; justify-content:center;">
  <div style="background:rgba(20,15,36,0.95); padding:20px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); width:85%; max-width:300px; display:flex; flex-direction:column; gap:12px;">
    <div style="font-size:15px; font-weight:800; color:#8c7ae6;"><i class="fa-solid fa-shield-halved"></i> Admin Password</div>
    <input type="password" id="admin-pass-input" placeholder="Enter password..." onkeydown="if(event.key==='Enter') verifyAdminPassword()">
    <button class="btn-main" onclick="verifyAdminPassword()" style="justify-content:center;">Login</button>
  </div>
</div>

<!-- Main UI -->
<div id="main-app">
  <div class="stylish-header">
    <div class="brand-title" id="brand-title">
      <i class="fa-solid fa-compact-disc fa-spin" style="--fa-animation-duration: 6s;"></i>
      <span>VFY STUDIO</span>
    </div>
    <div class="search-toggle-btn" onclick="toggleSearchDropdown()">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>

    <!-- In-Header Search Dropdown -->
    <div class="search-dropdown" id="search-dropdown">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:#8c7ae6;">
        <span><i class="fa-solid fa-magnifying-glass"></i> Search Track</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="toggleSearchDropdown()"></i>
      </div>
      <div class="search-box-wrapper">
        <input type="text" id="query-input" placeholder="Search track name..." onkeydown="if(event.key==='Enter') document.getElementById('search-btn').click()">
        <button id="search-btn" class="btn-main"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <!-- Search Results in 4 items per line grid format -->
      <div class="search-grid" id="search-results"></div>
    </div>
  </div>

  <div class="category-chips">
    <div class="chip active" onclick="filterTab('All', this)">All Queue</div>
    <div class="chip" onclick="filterTab('Bhojpuri', this)">Bhojpuri</div>
    <div class="chip" onclick="filterTab('Hindi', this)">Hindi</div>
    <div class="chip" onclick="filterTab('Bhakti', this)">Bhakti</div>
    <div class="chip" onclick="filterTab('Punjabi', this)">Punjabi</div>
  </div>

  <!-- Home View -->
  <div id="home-view" style="display:flex; flex-direction:column; gap:10px; flex:1; overflow:hidden;">
    <div class="slideshow-wrapper" id="slideshow-container"></div>
    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:6px; display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <div class="section-heading" id="queue-heading">Station Queue</div>
      <div id="playlist-container" style="overflow-y:auto; flex:1; padding-right:2px;">Loading queue...</div>
    </div>
  </div>

  <!-- Profile View -->
  <div id="profile-view" style="display:none; flex-direction:column; align-items:center; text-align:center; gap:10px; flex:1; overflow-y:auto;">
    <img src="https://i.imgur.com/8Q5N8bB.png" style="width:80px; height:80px; border-radius:50%; border:2px solid #8c7ae6; object-fit:cover;">
    <div style="font-size:16px; font-weight:800;">Vivek Masona</div>
    <div style="font-size:11px; color:#8c7ae6; font-weight:700;">Lead Developer & Engineer</div>
    <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); padding:12px; border-radius:16px; width:100%; text-align:left; box-sizing:border-box;">
      <div style="font-size:12px; font-weight:700; margin-bottom:4px;"><i class="fa-solid fa-circle-info"></i> App Details</div>
      <div style="font-size:10px; color:#aaa; line-height:1.5;">
        • Platform: VFY FM Live Studio Console<br>
        • Sync: Global Server Clock (Zero Delay)<br>
        • Media Session API Enabled for Notifications
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav-bar">
    <div class="nav-item active" id="nav-home" onclick="switchMainTab('home')"><i class="fa-solid fa-house"></i></div>
    <div class="center-disk-btn" id="disk-btn" onclick="startLiveAudio()" title="Play Live">
      <img src="https://i.imgur.com/8Q5N8bB.png" id="disk-img">
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchMainTab('profile')"><i class="fa-solid fa-user"></i></div>
  </div>
</div>

<div id="toast">Track saved!</div>
<audio id="audio-element" crossorigin="anonymous"></audio>

<script>
var audioEl = document.getElementById("audio-element");
var diskBtn = document.getElementById("disk-btn");
var diskImg = document.getElementById("disk-img");

let globalPlaylist = [];
let categoryStore = { Bhojpuri: [], Hindi: [], Bhakti: [], Punjabi: [] };
let activeIndex = -1;
let currentTabCategory = 'All';

if (localStorage.getItem('vfy_cat_store')) {
  try { categoryStore = JSON.parse(localStorage.getItem('vfy_cat_store')); } catch(e){}
}
function saveLocalCategories() { localStorage.setItem('vfy_cat_store', JSON.stringify(categoryStore)); }

let tapCount = 0;
document.getElementById("brand-title").addEventListener('click', () => {
  tapCount++;
  if (tapCount === 3) {
    document.getElementById("auth-modal").style.display = "flex";
    tapCount = 0;
  }
  setTimeout(() => { tapCount = 0; }, 800);
});

function verifyAdminPassword() {
  const pass = document.getElementById("admin-pass-input").value;
  if (pass === "vivekbabu") {
    document.getElementById("auth-modal").style.display = "none";
    showToast("✓ Admin Logged In");
  } else { alert("Wrong Password!"); }
}

function toggleSearchDropdown() {
  const dropdown = document.getElementById("search-dropdown");
  dropdown.classList.toggle("open");
}

function switchMainTab(tab) {
  document.getElementById("nav-home").classList.remove("active");
  document.getElementById("nav-profile").classList.remove("active");
  if (tab === 'home') {
    document.getElementById("nav-home").classList.add("active");
    document.getElementById("home-view").style.display = "flex";
    document.getElementById("profile-view").style.display = "none";
  } else {
    document.getElementById("nav-profile").classList.add("active");
    document.getElementById("home-view").style.display = "none";
    document.getElementById("profile-view").style.display = "flex";
  }
}

function filterTab(category, el) {
  currentTabCategory = category;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById("queue-heading").innerText = category === 'All' ? 'Station Queue' : `${category} Playlist`;
  renderPlaylistUI();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function pollGlobalState() {
  const fetchStartTime = Date.now();
  fetch('/api/playlist')
    .then(res => res.json())
    .then(data => {
      globalPlaylist = Array.isArray(data.playlist) ? data.playlist : [];
      let newIndex = data.currentIndex || 0;
      let seekTime = data.seekTime || 0;
      let sTime = data.serverTime || fetchStartTime;
      
      renderPlaylistUI();
      renderSlideshow();

      if (globalPlaylist.length > 0) {
        activeIndex = newIndex;
        playSongAtIndex(activeIndex, seekTime, sTime);
      }
    })
    .catch(err => console.error(err));
}

function renderSlideshow() {
  const container = document.getElementById("slideshow-container");
  if (globalPlaylist.length === 0) {
    container.innerHTML = "<div style='font-size:11px; color:#666;'>No active radio stream.</div>";
    return;
  }
  let html = "";
  globalPlaylist.forEach((song, idx) => {
    let isLive = (idx === activeIndex);
    html += `
      <div class="slide-card">
        <img src="${song.image || 'https://i.imgur.com/8Q5N8bB.png'}">
        <div class="slide-overlay">
          ${isLive ? `
            <div class="live-ripple-badge">
              <div class="ripple-tower"><div class="core"></div><div class="wave"></div></div>
              <span style="font-size:9px; font-weight:800; color:#ff4757;">ON AIR LIVE</span>
            </div>
          ` : '<div></div>'}
          <div>
            <div style="font-size:13px; font-weight:800; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.8);">${song.title}</div>
            <div style="font-size:10px; color:#2ed573; font-weight:700;">${song.primaryArtists || 'VFY Radio'}</div>
          </div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderPlaylistUI() {
  const container = document.getElementById("playlist-container");
  if (currentTabCategory === 'All') {
    if (globalPlaylist.length === 0) { container.innerHTML = "Queue empty."; return; }
    let html = "";
    globalPlaylist.forEach((song, index) => {
      let isLive = (index === activeIndex);
      html += `
        <div class="item-card" style="${isLive ? 'border-color:#2ed573; background:rgba(46,213,115,0.08);' : ''}">
          <img src="${song.image || 'https://i.imgur.com/8Q5N8bB.png'}" class="album-art">
          <div class="item-info">
            <div class="item-title">${isLive ? '<i class="fa-solid fa-play" style="color:#2ed573;"></i> ' : ''}${song.title}</div>
            <div class="item-artist">${song.primaryArtists || 'VFY FM'}</div>
          </div>
          <button class="btn-main" onclick="adminSelectSong(${index})" style="padding:4px 8px; font-size:10px;">Play</button>
          <button onclick="deleteGlobalSong(${index})" style="background:rgba(255,71,87,0.2); color:#ff4757; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer;"><i class="fa-solid fa-trash" style="font-size:10px;"></i></button>
        </div>
      `;
    });
    container.innerHTML = html;
  } else {
    let list = categoryStore[currentTabCategory] || [];
    if (list.length === 0) { container.innerHTML = `<div style="padding:10px; color:#666;">No songs saved in ${currentTabCategory}.</div>`; return; }
    let html = "";
    list.forEach((song, index) => {
      html += `
        <div class="item-card">
          <img src="${song.image || 'https://i.imgur.com/8Q5N8bB.png'}" class="album-art">
          <div class="item-info">
            <div class="item-title">${song.title}</div>
            <div class="item-artist">${song.primaryArtists}</div>
          </div>
          <button class="btn-main" onclick="addGlobalSongObj('${encodeURIComponent(JSON.stringify(song))}')" style="padding:4px 8px; font-size:10px;">+ Live</button>
          <button onclick="deleteCategorySong('${currentTabCategory}', ${index})" style="background:rgba(255,71,87,0.2); color:#ff4757; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer;"><i class="fa-solid fa-trash" style="font-size:10px;"></i></button>
        </div>
      `;
    });
    container.innerHTML = html;
  }
}

// Search Results in 4 items per line square grid format
document.getElementById("search-btn").addEventListener("click", () => {
  const q = document.getElementById("query-input").value.trim();
  if (!q) return;
  const results = document.getElementById("search-results");
  results.innerHTML = "<div style='font-size:11px; color:#888; grid-column:span 4; text-align:center;'>Searching...</div>";
  fetch(`/api/search?q=${encodeURIComponent(q)}`)
    .then(res => res.json())
    .then(data => {
      const songs = data.results || [];
      if (songs.length === 0) { results.innerHTML = "<div style='font-size:11px; color:#888; grid-column:span 4; text-align:center;'>No results.</div>"; return; }
      let html = "";
      songs.forEach((s) => {
        const objStr = encodeURIComponent(JSON.stringify(s));
        html += `
          <div class="grid-card">
            <img src="${s.image}">
            <div class="grid-title" title="${s.title}">${s.title}</div>
            <div class="grid-actions">
              <button class="btn-main" onclick="addGlobalSongObj('${objStr}')" style="padding:2px 4px; font-size:8px;" title="Live">+L</button>
              <button class="btn-main" onclick="addCategorySong('${objStr}')" style="background:#2ed573; color:#000; padding:2px 4px; font-size:8px;" title="Tab">+T</button>
            </div>
          </div>
        `;
      });
      results.innerHTML = html;
    });
});

function addGlobalSongObj(encodedObj) {
  const song = JSON.parse(decodeURIComponent(encodedObj));
  fetch('/api/playlist', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(song)
  }).then(res => res.json()).then(data => {
    globalPlaylist = data.playlist;
    renderPlaylistUI();
    renderSlideshow();
    showToast("✓ Added to Live Station Queue!");
  });
}

function addCategorySong(encodedObj) {
  const song = JSON.parse(decodeURIComponent(encodedObj));
  let cat = currentTabCategory === 'All' ? 'Bhojpuri' : currentTabCategory;
  if (!categoryStore[cat]) categoryStore[cat] = [];
  categoryStore[cat].push(song);
  saveLocalCategories();
  renderPlaylistUI();
  showToast(`✓ Added to ${cat} Playlist!`);
}

function deleteCategorySong(cat, idx) {
  categoryStore[cat].splice(idx, 1);
  saveLocalCategories();
  renderPlaylistUI();
}

function adminSelectSong(idx) {
  fetch('/api/play', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: idx })
  }).then(res => res.json()).then(data => {
    globalPlaylist = data.playlist;
    activeIndex = data.currentIndex;
    playSongAtIndex(activeIndex, data.seekTime, data.serverTime);
    renderPlaylistUI();
    renderSlideshow();
  });
}

function deleteGlobalSong(idx) {
  fetch(`/api/playlist/${idx}`, { method: 'DELETE' })
    .then(res => res.json()).then(data => {
      globalPlaylist = data.playlist;
      renderPlaylistUI();
      renderSlideshow();
    });
}

function playSongAtIndex(index, baseSeek, serverTs) {
  if (globalPlaylist.length === 0) return;
  const song = globalPlaylist[index % globalPlaylist.length];
  if (!song || !song.url) return;

  diskImg.src = song.image || 'https://i.imgur.com/8Q5N8bB.png';

  const delay = (Date.now() - serverTs) / 1000;
  const targetSeek = baseSeek + Math.max(0, delay);

  if (audioEl.src !== song.url) {
    audioEl.src = song.url;
    audioEl.currentTime = targetSeek;
  } else if (Math.abs(audioEl.currentTime - targetSeek) > 0.6) {
    audioEl.currentTime = targetSeek;
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title || "VFY FM Live",
      artist: song.primaryArtists || "VFY Studio",
      album: "Live 24/7 Radio",
      artwork: [{ src: song.image || 'https://i.imgur.com/8Q5N8bB.png', sizes: '512x512', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); });
    navigator.mediaSession.setActionHandler('pause', () => { audioEl.pause(); });
    navigator.mediaSession.setActionHandler('nexttrack', () => { pollGlobalState(); });
  }

  audioEl.play().then(() => {
    diskBtn.classList.add("playing");
  }).catch(() => {
    diskBtn.classList.remove("playing");
  });
}

function startLiveAudio() { pollGlobalState(); }
window.addEventListener('load', () => { pollGlobalState(); });
</script>

</body>
</html>

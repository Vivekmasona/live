<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFY FM Studio</title>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
html, body {
  margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background: #07070a;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
}

#studio-header {
  width: calc(100% - 30px); max-width: 500px; margin-top: 15px;
  background: rgba(15, 15, 22, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 12px 20px; border-radius: 20px; z-index: 40; display: flex; justify-content: space-between; align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.5); user-select: none;
}
.brand-title { 
  font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; 
  display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px;
}
.brand-title i { color: #00f2fe; filter: drop-shadow(0 0 8px rgba(0,242,254,0.5)); }
.brand-title span { color: #00f2fe; }

.badge-box { display: flex; align-items: center; gap: 10px; }
.badge { background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 12px; font-size: 11px; color: #aaa; border: 1px solid rgba(255,255,255,0.08); }

/* Live Dot */
.live-dot { width: 9px; height: 9px; background: #ff4757; border-radius: 50%; box-shadow: 0 0 10px #ff4757; transition: 0.3s; }
.live-dot.active { background: #2ed573; box-shadow: 0 0 14px #2ed573; }

/* Minimal Live Play Container */
.main-player-card {
  background: rgba(16, 16, 24, 0.85); backdrop-filter: blur(20px);
  width: 80%; max-width: 320px; padding: 40px 20px; border-radius: 28px;
  border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
  margin: auto;
}
.live-text { font-size: 14px; font-weight: 600; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }

/* Big Round Play Button (No Pause) */
.big-round-btn {
  width: 75px; height: 75px; border-radius: 50%; background: linear-gradient(135deg, #11998e, #38ef7d);
  color: #000; border: none; display: flex; align-items: center; justify-content: center; font-size: 26px;
  cursor: pointer; box-shadow: 0 6px 25px rgba(56, 239, 125, 0.4); transition: 0.2s;
}
.big-round-btn:hover { transform: scale(1.08); }

/* Glassmorphic Modals */
#studio-modal, #auth-modal {
  position: fixed; inset: 0; background: rgba(5, 5, 8, 0.85); z-index: 100;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(25px);
}
.studio-container {
  background: rgba(16, 16, 24, 0.9); backdrop-filter: blur(24px);
  width: 92%; max-width: 520px; height: 82vh;
  border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 22px;
  box-shadow: 0 30px 90px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 12px;
}
.auth-container {
  background: rgba(16, 16, 24, 0.9); backdrop-filter: blur(24px);
  width: 90%; max-width: 360px;
  border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 16px;
}
.studio-title, .auth-title { font-size: 18px; color: #00f2fe; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }

.search-box-wrapper { display: flex; gap: 10px; align-items: center; width: 100%; }
input[type="text"], input[type="password"] {
  flex: 1; width: auto; padding: 10px 14px; background: rgba(10, 10, 15, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 12px; outline: none; font-size: 14px;
}
input[type="text"]:focus, input[type="password"]:focus { border-color: #00f2fe; box-shadow: 0 0 12px rgba(0,242,254,0.25); }

button {
  background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; border: none; padding: 10px 18px;
  font-size: 13px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: 0.2s;
  box-shadow: 0 4px 20px rgba(0, 114, 255, 0.3); display: flex; align-items: center; gap: 6px;
  flex-shrink: 0; white-space: nowrap;
}
button:hover { opacity: 0.95; }

.item-card {
  background: rgba(25, 25, 35, 0.6); padding: 8px 12px; border-radius: 12px;
  font-size: 13px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 6px; transition: 0.2s;
}
.item-card:hover { border-color: #00f2fe; background: rgba(15, 35, 45, 0.7); }
.item-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; flex: 1; }
.btn-group { display: flex; gap: 8px; align-items: center; }

.round-preview-btn {
  width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #3742fa, #5352ed); color: white;
  border: none; display: flex; align-items: center; justify-content: center; font-size: 11px;
  cursor: pointer; box-shadow: 0 3px 10px rgba(55,66,250,0.4); flex-shrink: 0; padding: 0;
}
.save-btn { background: linear-gradient(135deg, #11998e, #38ef7d); color: #000; padding: 5px 12px; font-size: 11px; font-weight: 700; border-radius: 8px; box-shadow: none; }
.delete-btn { background: rgba(255, 71, 87, 0.85); padding: 5px 10px; font-size: 11px; border-radius: 8px; box-shadow: none; }

/* Toast Notification */
#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: rgba(56, 239, 125, 0.95); color: #000; padding: 10px 24px; border-radius: 30px;
  font-size: 13px; font-weight: 700; z-index: 1000; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Developer signature exact 20px height */
.dev-sig { height: 20px; line-height: 20px; font-size: 9px; color: rgba(255,255,255,0.3); text-align: center; letter-spacing: 1px; text-transform: uppercase; margin-top: auto; flex-shrink: 0; width: 100%; }
</style>
</head>
<body>

<div id="studio-header">
  <div class="brand-title" id="brand-title">
    <i class="fa-solid fa-headset"></i> <span>VFY FM</span> <small style="font-size:10px; color:rgba(255,255,255,0.4); font-weight:normal;">(Tap 3x)</small>
  </div>
  <div class="badge-box">
    <div class="badge"><i class="fa-solid fa-broadcast-tower"></i> Live 24/7</div>
    <div class="live-dot" id="live-dot"></div>
  </div>
</div>

<!-- Minimal Live FM Player (No Image, No Title, Only Play) -->
<div class="main-player-card">
  <div class="live-text"><i class="fa-solid fa-radio"></i> VFY Live FM</div>
  <button class="big-round-btn" onclick="startLiveAudio()"><i class="fa-solid fa-play"></i></button>
</div>

<!-- Password Modal -->
<div id="auth-modal">
  <div class="auth-container">
    <div class="auth-title">
      <span><i class="fa-solid fa-shield-halved"></i> Admin Access</span>
      <button onclick="closeAuthModal()" style="background:rgba(255,255,255,0.08); padding:6px 10px; font-size:12px; box-shadow:none;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <input type="password" id="admin-pass-input" placeholder="Enter password here..." onkeydown="if(event.key==='Enter') verifyAdminPassword()">
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button onclick="closeAuthModal()" style="background:rgba(255,255,255,0.08); box-shadow:none;">Cancel</button>
      <button onclick="verifyAdminPassword()" style="background:linear-gradient(135deg, #11998e, #38ef7d); color:#000; box-shadow:none;"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button>
    </div>
  </div>
</div>

<!-- Master Console Modal -->
<div id="studio-modal">
  <div class="studio-container">
    <div class="studio-title">
      <span><i class="fa-solid fa-sliders"></i> Master Console</span>
      <button onclick="closeStudio()" style="background:rgba(255,255,255,0.08); padding:6px 12px; font-size:12px; box-shadow:none;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="search-box-wrapper">
      <input type="text" id="query-input" placeholder="Search track name..." onkeydown="if(event.key==='Enter') document.getElementById('search-btn').click()">
      <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
    </div>

    <div id="search-results" style="max-height:160px; overflow-y:auto;"></div>

    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:10px; display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <div style="font-size:13px; color:#38ef7d; margin-bottom:6px; font-weight:700; flex-shrink:0;"><i class="fa-solid fa-list-ul"></i> Station Queue</div>
      <div id="playlist-container" style="overflow-y:auto; font-size:13px; color:#aaa; flex:1;">Loading queue...</div>
    </div>
    
    <div class="dev-sig">developer vivekmasona</div>
  </div>
</div>

<div id="toast">Track saved successfully!</div>

<audio id="audio-element" crossorigin="anonymous" controlslist="nodownload noplaybackrate" disablepictureinpicture></audio>
<audio id="preview-audio"></audio>

<script>
let globalPlaylist = [];
let activeIndex = -1;
let syncTimeout = null;

const audioEl = document.getElementById("audio-element");
const previewAudio = document.getElementById("preview-audio");
const liveDot = document.getElementById("live-dot");

let activePreviewUrl = null;
let activePreviewBtn = null;

// Triple Click for Admin Modal
let tapCount = 0;
let tapTimer = null;
const brandTitle = document.getElementById("brand-title");

brandTitle.addEventListener('click', () => {
  tapCount++;
  if (tapCount === 3) {
    document.getElementById("auth-modal").style.display = "flex";
    document.getElementById("admin-pass-input").value = "";
    document.getElementById("admin-pass-input").focus();
    tapCount = 0;
  }
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 800);
});

function closeAuthModal() {
  document.getElementById("auth-modal").style.display = "none";
}

function verifyAdminPassword() {
  const pass = document.getElementById("admin-pass-input").value;
  if (pass === "vivekbabu") {
    closeAuthModal();
    document.getElementById("studio-modal").style.display = "flex";
    renderPlaylistUI();
  } else {
    alert("Wrong Password!");
    document.getElementById("admin-pass-input").value = "";
  }
}

function closeStudio() {
  stopPreview();
  document.getElementById("query-input").value = "";
  document.getElementById("search-results").innerHTML = "";
  document.getElementById("studio-modal").style.display = "none";
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.innerText = message;
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); }, 2500);
}

function pollGlobalState() {
  fetch('/api/playlist')
    .then(res => res.json())
    .then(data => {
      globalPlaylist = Array.isArray(data.playlist) ? data.playlist : [];
      let newIndex = data.currentIndex || 0;
      let seekTime = data.seekTime || 0;
      
      if (document.getElementById("studio-modal").style.display === "flex") {
        renderPlaylistUI();
      }

      if (globalPlaylist.length > 0) {
        if (newIndex !== activeIndex || Math.abs(audioEl.currentTime - seekTime) > 2.0) {
          activeIndex = newIndex;
          playSongAtIndex(activeIndex, seekTime);
        }
      } else {
        liveDot.classList.remove("active");
      }
      scheduleNextSync();
    })
    .catch(err => {
      console.error("Sync error:", err);
      liveDot.classList.remove("active");
      syncTimeout = setTimeout(pollGlobalState, 10000);
    });
}

function scheduleNextSync() {
  if (syncTimeout) clearTimeout(syncTimeout);
  if (audioEl.duration && !isNaN(audioEl.duration)) {
    let remainingTimeMs = Math.max(2000, (audioEl.duration - audioEl.currentTime) * 1000);
    syncTimeout = setTimeout(pollGlobalState, remainingTimeMs);
  } else {
    syncTimeout = setTimeout(pollGlobalState, 30000);
  }
}

function startLiveAudio() {
  autoPlayLiveRadio();
}

function renderPlaylistUI() {
  const container = document.getElementById("playlist-container");
  if (globalPlaylist.length === 0) {
    container.innerHTML = "No tracks in queue.";
    return;
  }

  let html = "";
  globalPlaylist.forEach((song, index) => {
    let highlight = (index === activeIndex) ? "border-color: #38ef7d; background: rgba(56,239,125,0.08);" : "";
    html += `
      <div class="item-card" style="${highlight}" onclick="adminSelectSong(${index})" title="Click to play On Air">
        <div class="item-info">${index === activeIndex ? '<i class="fa-solid fa-play" style="color:#38ef7d;"></i> [ON AIR] ' : ''}${song.title}</div>
        <button class="delete-btn" onclick="event.stopPropagation(); deleteGlobalSong(${index})"><i class="fa-solid fa-trash"></i></button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function adminSelectSong(index) {
  fetch('/api/play', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: index })
  })
  .then(res => res.json())
  .then(data => {
    globalPlaylist = data.playlist;
    activeIndex = data.currentIndex;
    playSongAtIndex(activeIndex, data.seekTime);
    renderPlaylistUI();
    scheduleNextSync();
  });
}

function deleteGlobalSong(index) {
  if (!confirm("Delete track?")) return;
  fetch(`/api/playlist/${index}`, { method: 'DELETE' })
    .then(res => res.json())
    .then(data => {
      globalPlaylist = data.playlist;
      activeIndex = data.currentIndex;
      if (globalPlaylist.length > 0) {
        playSongAtIndex(activeIndex, data.seekTime);
      } else {
        audioEl.pause();
        audioEl.src = "";
        liveDot.classList.remove("active");
      }
      renderPlaylistUI();
      scheduleNextSync();
    });
}

document.getElementById("search-btn").addEventListener("click", () => {
  const query = document.getElementById("query-input").value.trim();
  if (!query) return;

  const resultsContainer = document.getElementById("search-results");
  resultsContainer.innerHTML = "Searching...";

  fetch(`/api/search?q=${encodeURIComponent(query)}`)
    .then(res => res.json())
    .then(data => {
      const songs = data.results || [];
      if (songs.length === 0) {
        resultsContainer.innerHTML = "No tracks found.";
        return;
      }

      let html = "";
      songs.forEach((s, idx) => {
        const songObj = encodeURIComponent(JSON.stringify(s));
        html += `
          <div class="item-card">
            <img src="${s.image || 'https://i.imgur.com/8Q5N8bB.png'}" style="width:34px; height:34px; border-radius:6px; object-fit:cover; margin-right:8px;">
            <div class="item-info" title="${s.title}">${s.title}</div>
            <div class="btn-group">
              <button class="round-preview-btn" id="prev-btn-${idx}" onclick="toggleSearchPreview('${s.url}', 'prev-btn-${idx}')"><i class="fa-solid fa-play" id="icon-${idx}"></i></button>
              <button class="save-btn" onclick="addGlobalSong('${songObj}')"><i class="fa-solid fa-plus"></i> Save</button>
            </div>
          </div>
        `;
      });
      resultsContainer.innerHTML = html;
    })
    .catch(err => { resultsContainer.innerHTML = "Search Error."; });
});

function toggleSearchPreview(url, btnId) {
  const btn = document.getElementById(btnId);
  const icon = btn.querySelector("i");
  if (activePreviewUrl === url && !previewAudio.paused) {
    previewAudio.pause();
    icon.className = "fa-solid fa-play";
  } else {
    if (activePreviewBtn && activePreviewBtn !== btn) {
      activePreviewBtn.querySelector("i").className = "fa-solid fa-play";
    }
    previewAudio.src = url;
    previewAudio.play().then(() => {
      activePreviewUrl = url;
      activePreviewBtn = btn;
      icon.className = "fa-solid fa-pause";
    }).catch(err => alert("Preview playback failed"));
  }
}

previewAudio.onended = () => {
  if (activePreviewBtn) {
    activePreviewBtn.querySelector("i").className = "fa-solid fa-play";
    activePreviewBtn = null;
    activePreviewUrl = null;
  }
};

function stopPreview() {
  previewAudio.pause();
  previewAudio.currentTime = 0;
  if (activePreviewBtn) {
    activePreviewBtn.querySelector("i").className = "fa-solid fa-play";
    activePreviewBtn = null;
    activePreviewUrl = null;
  }
}

window.addGlobalSong = function(encodedObj) {
  const songData = JSON.parse(decodeURIComponent(encodedObj));
  songData.duration = Number(songData.duration) || 180;

  fetch('/api/playlist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(songData)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      globalPlaylist = data.playlist;
      renderPlaylistUI();
      scheduleNextSync();
      showToast("✓ Track saved successfully!");
    }
  })
  .catch(err => { showToast("❌ Error saving track."); });
};

window.addEventListener('load', () => {
  autoPlayLiveRadio();
});

function autoPlayLiveRadio() {
  fetch('/api/playlist')
    .then(res => res.json())
    .then(data => {
      globalPlaylist = Array.isArray(data.playlist) ? data.playlist : [];
      if (globalPlaylist.length === 0) return;
      
      activeIndex = data.currentIndex || 0;
      playSongAtIndex(activeIndex, data.seekTime || 0);
      scheduleNextSync();
    })
    .catch(err => console.error(err));
}

function playSongAtIndex(index, seekTime = 0) {
  if (globalPlaylist.length === 0) return;
  activeIndex = index % globalPlaylist.length;
  const song = globalPlaylist[activeIndex];

  if (!song || !song.url) return;

  if (audioEl.src !== song.url) {
    audioEl.src = song.url;
    audioEl.currentTime = seekTime;
  } else {
    if (Math.abs(audioEl.currentTime - seekTime) > 1.5) {
      audioEl.currentTime = seekTime;
    }
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title || "VFY FM Live",
      artist: song.primaryArtists || "VFY FM Studio",
      album: "Live 24/7 Radio",
      artwork: [
        { src: song.image || 'https://i.imgur.com/8Q5N8bB.png', sizes: '512x512', type: 'image/jpeg' }
      ]
    });
    
    navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); });
    navigator.mediaSession.setActionHandler('pause', () => {});
    navigator.mediaSession.setActionHandler('nexttrack', () => { pollGlobalState(); });
  }

  audioEl.play().then(() => {
    liveDot.classList.add("active");
  }).catch(err => {
    liveDot.classList.remove("active");
  });
}
</script>

</body>
</html>

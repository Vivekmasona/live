<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFY FM Studio</title>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

html, body {
  margin: 0; padding: 0; overflow: hidden; background: #07050f;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #fff;
}
canvas { position: fixed; inset: 0; z-index: 1; }

#studio-header {
  position: fixed; top: 15px; left: 15px; right: 15px;
  background: rgba(18, 14, 32, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  padding: 12px 20px; border-radius: 24px; z-index: 40; display: flex; justify-content: space-between; align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0,0,0,0.7); user-select: none;
}
.brand-title { 
  font-size: 16px; font-weight: 800; color: #fff; cursor: pointer; 
  display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px;
}
.brand-title i { color: #6c5ce7; filter: drop-shadow(0 0 10px rgba(108,92,231,0.8)); }
.brand-title span { color: #8c7ae6; }

.badge-box { display: flex; align-items: center; gap: 10px; }
.badge { background: rgba(255, 255, 255, 0.05); padding: 6px 14px; border-radius: 14px; font-size: 11px; font-weight: 600; color: #aaa; border: 1px solid rgba(255,255,255,0.08); }

/* Live Dot */
.live-dot { width: 9px; height: 9px; background: #ff4757; border-radius: 50%; box-shadow: 0 0 10px #ff4757; transition: 0.3s; }
.live-dot.active { background: #2ed573; box-shadow: 0 0 14px #2ed573; }

/* Glassmorphic Modals */
#studio-modal, #auth-modal {
  position: fixed; inset: 0; background: rgba(5, 3, 12, 0.88); z-index: 100;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
}
.studio-container {
  background: linear-gradient(180deg, rgba(24, 18, 43, 0.9) 0%, rgba(13, 10, 25, 0.95) 100%);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  width: 92%; max-width: 520px; height: 88vh;
  border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 32px; padding: 22px;
  box-shadow: 0 30px 100px rgba(0,0,0,0.95), 0 0 40px rgba(108, 92, 231, 0.15); display: flex; flex-direction: column; gap: 14px;
}
.auth-container {
  background: rgba(20, 15, 36, 0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  width: 90%; max-width: 360px;
  border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px; padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.95); display: flex; flex-direction: column; gap: 16px;
}
.studio-title, .auth-title { font-size: 18px; color: #fff; font-weight: 800; display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.3px; }
.studio-title i { color: #8c7ae6; }

/* Chips Category Filter Scroll UI */
.category-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.category-chips::-webkit-scrollbar { display: none; }
.chip { 
  background: rgba(255, 255, 255, 0.06); padding: 8px 18px; border-radius: 30px; font-size: 12px; font-weight: 600; 
  color: #a0a0b8; border: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer; white-space: nowrap; transition: 0.25s ease; 
}
.chip.active, .chip:hover { background: linear-gradient(135deg, #4834d4, #686de0); color: #fff; border-color: transparent; box-shadow: 0 4px 15px rgba(104, 109, 224, 0.4); }

.search-box-wrapper { display: flex; gap: 8px; align-items: center; width: 100%; }
input[type="text"], input[type="password"] {
  flex: 1; width: auto; padding: 12px 18px; background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08); color: #fff; border-radius: 20px; outline: none; font-size: 13px; font-weight: 500;
  transition: 0.25s ease;
}
input[type="text"]:focus, input[type="password"]:focus { 
  background: rgba(255, 255, 255, 0.08); border-color: rgba(104, 109, 224, 0.6); box-shadow: 0 0 20px rgba(104,109,224,0.25); 
}

button {
  background: linear-gradient(135deg, #4834d4, #686de0); color: white; border: none; padding: 12px 20px;
  font-size: 13px; font-weight: 700; border-radius: 20px; cursor: pointer; transition: 0.25s ease;
  box-shadow: 0 6px 20px rgba(72, 52, 212, 0.4); display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; white-space: nowrap;
}
button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(72, 52, 212, 0.6); }

#controls {
  position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
  z-index: 30; display: none;
}
#live-btn {
  background: linear-gradient(135deg, #6c5ce7, #a29bfe); padding: 16px 44px; font-size: 14px; border-radius: 50px;
  box-shadow: 0 10px 40px rgba(108, 92, 231, 0.5); color: #000; font-weight: 800; letter-spacing: 0.5px;
}

/* Modern Song List Cards UI */
.item-card {
  background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); padding: 10px 14px; border-radius: 20px;
  display: flex; flex-direction: column; gap: 8px;
  border: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 8px; transition: 0.25s ease;
}
.item-card:hover { border-color: rgba(108, 92, 231, 0.4); background: rgba(255, 255, 255, 0.06); }
.item-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 12px; }

/* Squircle Artwork styling matching image */
.album-art {
  width: 48px; height: 48px; border-radius: 14px; object-fit: cover; flex-shrink: 0;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
}

.item-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.item-title { font-size: 13px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-artist { font-size: 11px; color: #9999b0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn-group { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

/* Round Play / Action Buttons */
.round-preview-btn {
  width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-size: 12px;
  cursor: pointer; flex-shrink: 0; padding: 0; transition: 0.2s ease;
}
.round-preview-btn:hover { background: #6c5ce7; border-color: #6c5ce7; box-shadow: 0 0 15px rgba(108, 92, 231, 0.6); }

.save-btn { 
  background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.3); 
  padding: 8px 16px; font-size: 11px; font-weight: 700; border-radius: 30px; box-shadow: none; 
}
.save-btn:hover { background: #2ed573; color: #000; border-color: #2ed573; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); }

.delete-btn { 
  background: rgba(255, 71, 87, 0.12); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.25);
  padding: 8px 14px; font-size: 11px; border-radius: 30px; box-shadow: none; 
}
.delete-btn:hover { background: #ff4757; color: #fff; border-color: #ff4757; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }

/* Queue Card Layout */
.queue-card {
  background: rgba(255, 255, 255, 0.03); padding: 12px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05);
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; transition: 0.25s ease;
}
.queue-card:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.12); }
.queue-card.on-air {
  background: rgba(108, 92, 231, 0.15); border-color: rgba(108, 92, 231, 0.5); box-shadow: 0 0 25px rgba(108, 92, 231, 0.15);
}

/* Audio Seekbar styling in Preview */
.preview-seek-container { display: none; width: 100%; align-items: center; gap: 10px; padding-top: 6px; }
.preview-seek-bar { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.12); height: 5px; border-radius: 10px; outline: none; }
.preview-seek-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #6c5ce7; cursor: pointer; box-shadow: 0 0 10px #6c5ce7; }
.preview-time { font-size: 10px; color: #8888a5; font-weight: 600; min-width: 32px; text-align: right; }

/* Toast Notification */
#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #6c5ce7; color: #fff; padding: 12px 28px; border-radius: 30px;
  font-size: 13px; font-weight: 800; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; opacity: 0; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.dev-sig { height: 20px; line-height: 20px; font-size: 9px; color: rgba(255,255,255,0.25); text-align: center; letter-spacing: 1.5px; text-transform: uppercase; margin-top: auto; flex-shrink: 0; font-weight: 700; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="studio-header">
  <div class="brand-title" id="brand-title">
    <i class="fa-solid fa-compact-disc fa-spin" style="--fa-animation-duration: 6s;"></i> <span>VFY FM</span> <small style="font-size:10px; color:rgba(255,255,255,0.3); font-weight:normal;">(Tap 3x)</small>
  </div>
  <div class="badge-box">
    <div class="badge"><i class="fa-solid fa-tower-broadcast"></i> Live 24/7</div>
    <div class="live-dot" id="live-dot"></div>
  </div>
</div>

<div id="controls">
  <button id="live-btn" onclick="startLiveAudio()"><i class="fa-solid fa-play"></i> TAP TO START LIVE FM</button>
</div>

<!-- Password Modal -->
<div id="auth-modal">
  <div class="auth-container">
    <div class="auth-title">
      <span><i class="fa-solid fa-shield-halved"></i> Admin Console</span>
      <button onclick="closeAuthModal()" style="background:rgba(255,255,255,0.06); padding:6px 12px; font-size:12px; box-shadow:none;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <input type="password" id="admin-pass-input" placeholder="Enter security pass..." onkeydown="if(event.key==='Enter') verifyAdminPassword()">
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button onclick="closeAuthModal()" style="background:rgba(255,255,255,0.06); box-shadow:none;">Cancel</button>
      <button onclick="verifyAdminPassword()" style="background:linear-gradient(135deg, #6c5ce7, #a29bfe); color:#000; box-shadow:none;"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    </div>
  </div>
</div>

<!-- Master Console Modal -->
<div id="studio-modal">
  <div class="studio-container">
    <div class="studio-title">
      <span><i class="fa-solid fa-sliders"></i> Studio Console</span>
      <button onclick="closeStudio()" style="background:rgba(255,255,255,0.06); padding:6px 12px; font-size:12px; box-shadow:none;"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Category Chips Filters -->
    <div class="category-chips">
      <div class="chip active">All</div>
      <div class="chip">Trending</div>
      <div class="chip">Bhojpuri</div>
      <div class="chip">Hindi</div>
      <div class="chip">Lofi</div>
    </div>
    
    <div class="search-box-wrapper">
      <input type="text" id="query-input" placeholder="Search track or artist name..." onkeydown="if(event.key==='Enter') document.getElementById('search-btn').click()">
      <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
    </div>

    <div id="search-results" style="max-height:220px; overflow-y:auto; padding-right:4px;"></div>

    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:12px; display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <div style="font-size:12px; color:#8c7ae6; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; font-weight:800; flex-shrink:0; display:flex; align-items:center; gap:6px;">
        <i class="fa-solid fa-list-check"></i> Station Queue
      </div>
      <div id="playlist-container" style="overflow-y:auto; font-size:13px; color:#aaa; flex:1; padding-right:4px;">Loading queue...</div>
    </div>
    
    <div class="dev-sig">Developer Vivek Masona</div>
  </div>
</div>

<div id="toast">Track saved successfully!</div>

<audio id="audio-element" crossorigin="anonymous" controlslist="nodownload noplaybackrate" disablepictureinpicture></audio>
<audio id="preview-audio"></audio>

<script src="https://codepen.io/Tibixx/pen/BbBxRG.js"></script>

<script>
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
w = ctx.canvas.width = window.innerWidth;
h = ctx.canvas.height = window.innerHeight;

window.onresize = function() {
  w = ctx.canvas.width = window.innerWidth;
  h = ctx.canvas.height = window.innerHeight;
};

var nrt=0, npt=0, dots=[], lines=[];
var config = { minRadius: 55, maxRadius: 95, multiplier: 45, colorSpeed: 20, hueStart: 220, centerImage: "https://i.imgur.com/8Q5N8bB.png" };

var bgImage = new Image();
bgImage.src = config.centerImage;

var AudioContext = window.AudioContext || window.webkitAudioContext;
var actx, analyser, sourceNode, frequencyData, frequencyDataLen;
var playing = false;
var dotEmitter, lineEmitter;
var audioEl = document.getElementById("audio-element");
var previewAudio = document.getElementById("preview-audio");
const liveDot = document.getElementById("live-dot");

let activePreviewUrl = null;
let activePreviewBtnId = null;

function initAudioContext() {
  if (!actx && AudioContext) {
    actx = new AudioContext();
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.55;
    sourceNode = actx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(actx.destination);
    frequencyDataLen = analyser.frequencyBinCount;
    frequencyData = new Uint8Array(frequencyDataLen);
  }
  if (actx && actx.state === 'suspended') { actx.resume(); }
}

let globalPlaylist = [];
let activeIndex = -1;
let syncTimeout = null;

let tapCount = 0;
let tapTimer = null;
const brandTitle = document.getElementById("brand-title");

brandTitle.addEventListener('click', () => {
  tapCount++;
  if (tapCount === 3) {
    document.getElementById("auth-modal").style.display = "flex";
    document.getElementById("admin-pass-input").value = "";
    document.getElementById("admin-pass-input").focus();
    tapCount = 0;
  }
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 800);
});

function closeAuthModal() {
  document.getElementById("auth-modal").style.display = "none";
}

function verifyAdminPassword() {
  const pass = document.getElementById("admin-pass-input").value;
  if (pass === "vivekbabu") {
    closeAuthModal();
    document.getElementById("studio-modal").style.display = "flex";
    renderPlaylistUI();
  } else {
    alert("Wrong Password!");
    document.getElementById("admin-pass-input").value = "";
  }
}

function closeStudio() {
  stopPreview();
  document.getElementById("studio-modal").style.display = "none";
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.innerText = message;
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); }, 2500);
}

function pollGlobalState() {
  const fetchStartTime = Date.now();
  fetch('/api/playlist')
    .then(res => res.json())
    .then(data => {
      globalPlaylist = Array.isArray(data.playlist) ? data.playlist : [];
      let newIndex = data.currentIndex || 0;
      let seekTime = data.seekTime || 0;
      let sTime = data.serverTime || fetchStartTime;
      
      if (document.getElementById("studio-modal").style.display === "flex") {
        renderPlaylistUI();
      }

      if (globalPlaylist.length > 0) {
        document.getElementById("controls").style.display = "none";
        activeIndex = newIndex;
        playSongAtIndex(activeIndex, seekTime, sTime);
      } else {
        document.getElementById("controls").style.display = "flex";
        liveDot.classList.remove("active");
      }
      scheduleNextSync();
    })
    .catch(err => {
      console.error("Sync error:", err);
      document.getElementById("controls").style.display = "flex";
      liveDot.classList.remove("active");
      syncTimeout = setTimeout(pollGlobalState, 10000);
    });
}

function scheduleNextSync() {
  if (syncTimeout) clearTimeout(syncTimeout);
  if (audioEl.duration && !isNaN(audioEl.duration)) {
    let remainingTimeMs = Math.max(2000, (audioEl.duration - audioEl.currentTime) * 1000);
    syncTimeout = setTimeout(pollGlobalState, remainingTimeMs);
  } else {
    syncTimeout = setTimeout(pollGlobalState, 30000);
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    pollGlobalState();
  }
});

function renderPlaylistUI() {
  const container = document.getElementById("playlist-container");
  if (globalPlaylist.length === 0) {
    container.innerHTML = "No tracks in queue.";
    return;
  }

  let html = "";
  globalPlaylist.forEach((song, index) => {
    let isOnAir = (index === activeIndex);
    let cardClass = isOnAir ? "queue-card on-air" : "queue-card";
    html += `
      <div class="${cardClass}" onclick="adminSelectSong(${index})" title="Click to play On Air">
        <div class="item-info">
          <div class="item-title">${isOnAir ? '<i class="fa-solid fa-volume-high" style="color:#6c5ce7; margin-right:6px;"></i>' : ''}${song.title}</div>
          <div class="item-artist">${song.primaryArtists || 'VFY FM Track'}</div>
        </div>
        <button class="delete-btn" onclick="event.stopPropagation(); deleteGlobalSong(${index})"><i class="fa-solid fa-trash-can"></i></button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function adminSelectSong(index) {
  fetch('/api/play', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: index })
  })
  .then(res => res.json())
  .then(data => {
    globalPlaylist = data.playlist;
    activeIndex = data.currentIndex;
    playSongAtIndex(activeIndex, data.seekTime, data.serverTime);
    renderPlaylistUI();
    scheduleNextSync();
  });
}

function deleteGlobalSong(index) {
  if (!confirm("Delete track?")) return;
  fetch(`/api/playlist/${index}`, { method: 'DELETE' })
    .then(res => res.json())
    .then(data => {
      globalPlaylist = data.playlist;
      activeIndex = data.currentIndex;
      if (globalPlaylist.length > 0) {
        playSongAtIndex(activeIndex, data.seekTime, data.serverTime);
      } else {
        audioEl.pause();
        audioEl.src = "";
        playing = false;
        liveDot.classList.remove("active");
        document.getElementById("controls").style.display = "flex";
      }
      renderPlaylistUI();
      scheduleNextSync();
    });
}

document.getElementById("search-btn").addEventListener("click", () => {
  const query = document.getElementById("query-input").value.trim();
  if (!query) return;

  const resultsContainer = document.getElementById("search-results");
  resultsContainer.innerHTML = "<div style='font-size:12px; color:#888; padding:10px;'>Searching tracks...</div>";

  fetch(`/api/search?q=${encodeURIComponent(query)}`)
    .then(res => res.json())
    .then(data => {
      const songs = data.results || [];
      if (songs.length === 0) {
        resultsContainer.innerHTML = "<div style='font-size:12px; color:#888; padding:10px;'>No tracks found.</div>";
        return;
      }

      let html = "";
      songs.forEach((s, idx) => {
        const songObj = encodeURIComponent(JSON.stringify(s));
        html += `
          <div class="item-card" id="card-${idx}">
            <div class="item-row" onclick="event.stopPropagation()">
              <img src="${s.image || config.centerImage}" class="album-art">
              <div class="item-info">
                <div class="item-title" title="${s.title}">${s.title}</div>
                <div class="item-artist" title="${s.primaryArtists || 'Unknown'}">${s.primaryArtists || 'Artist'}</div>
              </div>
              <div class="btn-group">
                <button class="round-preview-btn" id="prev-btn-${idx}" onclick="toggleSearchPreview('${s.url}', 'prev-btn-${idx}', ${idx})"><i class="fa-solid fa-play" id="icon-${idx}"></i></button>
                <button class="save-btn" onclick="addGlobalSong('${songObj}')"><i class="fa-solid fa-plus"></i> Save</button>
              </div>
            </div>
            <div class="preview-seek-container" id="seek-container-${idx}">
              <span class="preview-time" id="current-time-${idx}">0:00</span>
              <input type="range" class="preview-seek-bar" id="seek-bar-${idx}" value="0" max="100" step="0.1" oninput="seekPreviewAudio(${idx})">
              <span class="preview-time" id="duration-time-${idx}">0:00</span>
            </div>
          </div>
        `;
      });
      resultsContainer.innerHTML = html;
    })
    .catch(err => { resultsContainer.innerHTML = "<div style='font-size:12px; color:#ff4757; padding:10px;'>Search Error.</div>"; });
});

function toggleSearchPreview(url, btnId, idx) {
  const btn = document.getElementById(btnId);
  const icon = btn.querySelector("i");
  const seekContainer = document.getElementById(`seek-container-${idx}`);

  if (activePreviewUrl === url && !previewAudio.paused) {
    previewAudio.pause();
    icon.className = "fa-solid fa-play";
  } else {
    if (activePreviewBtnId) {
      const prevBtn = document.getElementById(activePreviewBtnId);
      if (prevBtn) prevBtn.querySelector("i").className = "fa-solid fa-play";
      const prevIdx = activePreviewBtnId.split('-').pop();
      const prevSeek = document.getElementById(`seek-container-${prevIdx}`);
      if (prevSeek) prevSeek.style.display = "none";
    }

    // Mute main live audio during preview
    audioEl.muted = true;

    previewAudio.src = url;
    previewAudio.play().then(() => {
      activePreviewUrl = url;
      activePreviewBtnId = btnId;
      icon.className = "fa-solid fa-pause";
      seekContainer.style.display = "flex";
    }).catch(err => {
      audioEl.muted = false;
      alert("Preview playback failed");
    });
  }
}

previewAudio.ontimeupdate = () => {
  if (previewAudio.duration && activePreviewBtnId) {
    const idx = activePreviewBtnId.split('-').pop();
    const seekBar = document.getElementById(`seek-bar-${idx}`);
    const currentTimeEl = document.getElementById(`current-time-${idx}`);
    const durationTimeEl = document.getElementById(`duration-time-${idx}`);

    if (seekBar) {
      seekBar.value = (previewAudio.currentTime / previewAudio.duration) * 100;
      currentTimeEl.innerText = formatTime(previewAudio.currentTime);
      durationTimeEl.innerText = formatTime(previewAudio.duration);
    }
  }
};

function seekPreviewAudio(idx) {
  const seekBar = document.getElementById(`seek-bar-${idx}`);
  if (previewAudio.duration) {
    const seekTo = (seekBar.value / 100) * previewAudio.duration;
    previewAudio.currentTime = seekTo;
  }
}

previewAudio.onended = () => {
  stopPreview();
};

function stopPreview() {
  previewAudio.pause();
  previewAudio.currentTime = 0;
  audioEl.muted = false;

  if (activePreviewBtnId) {
    const btn = document.getElementById(activePreviewBtnId);
    if (btn) btn.querySelector("i").className = "fa-solid fa-play";
    const idx = activePreviewBtnId.split('-').pop();
    const seekContainer = document.getElementById(`seek-container-${idx}`);
    if (seekContainer) seekContainer.style.display = "none";

    activePreviewBtnId = null;
    activePreviewUrl = null;
  }
}

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

window.addGlobalSong = function(encodedObj) {
  const songData = JSON.parse(decodeURIComponent(encodedObj));
  songData.duration = Number(songData.duration) || 180;

  fetch('/api/playlist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(songData)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      globalPlaylist = data.playlist;
      renderPlaylistUI();
      scheduleNextSync();
      showToast("✓ Track saved successfully!");
    }
  })
  .catch(err => { showToast("❌ Error saving track."); });
};

window.addEventListener('load', () => {
  autoPlayLiveRadio();
});

function autoPlayLiveRadio() {
  initAudioContext();
  fetch('/api/playlist')
    .then(res => res.json())
    .then(data => {
      globalPlaylist = Array.isArray(data.playlist) ? data.playlist : [];
      if (globalPlaylist.length === 0) return;
      
      activeIndex = data.currentIndex || 0;
      playSongAtIndex(activeIndex, data.seekTime || 0, data.serverTime || Date.now());
      scheduleNextSync();
    })
    .catch(err => {
      document.getElementById("controls").style.display = "block";
    });
}

function startLiveAudio() {
  document.getElementById("controls").style.display = "none";
  autoPlayLiveRadio();
}

function playSongAtIndex(index, baseSeekTime, serverTimestamp) {
  if (globalPlaylist.length === 0) return;
  activeIndex = index % globalPlaylist.length;
  const song = globalPlaylist[activeIndex];

  if (!song || !song.url) return;
  if (song.image) { bgImage.src = song.image; }

  const networkDelay = (Date.now() - serverTimestamp) / 1000;
  const exactTargetSeek = baseSeekTime + Math.max(0, networkDelay);

  if (audioEl.src !== song.url) {
    audioEl.src = song.url;
    audioEl.currentTime = exactTargetSeek;
  } else {
    if (Math.abs(audioEl.currentTime - exactTargetSeek) > 0.6) {
      audioEl.currentTime = exactTargetSeek;
    }
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title || "VFY FM Live",
      artist: song.primaryArtists || "VFY FM Studio",
      album: "Live 24/7 Radio",
      artwork: [
        { src: song.image || config.centerImage, sizes: '512x512', type: 'image/jpeg' }
      ]
    });
    
    navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); });
    navigator.mediaSession.setActionHandler('pause', () => {});
    navigator.mediaSession.setActionHandler('nexttrack', () => { pollGlobalState(); });
  }

  audioEl.play().then(() => {
    document.getElementById("controls").style.display = "none";
    liveDot.classList.add("active");
    if (!playing) {
      dotEmitter = setInterval(emitDot, 50);
      lineEmitter = setInterval(emitLine, 100);
      playing = true;
      render();
    }
  }).catch(err => {
    document.getElementById("controls").style.display = "block";
    liveDot.classList.remove("active");
  });
}

// Visualizers
function emitDot(){ if (dots.length > 80) return; dots.push({ xp: w/2, yp: h/2, xv: Math.random()*0.4-0.2, yv: Math.random()*0.4-0.2, rad: Math.random()*(10-2)+2, hue: Math.random()*50-25 }); }
function emitLine(){ if (lines.length > 30) return; lines.push({ xp: w/2, yp: h/2, xv: Math.random()*0.4-0.2, yv: Math.random()*0.4-0.2, hue: Math.random()*50-25 }); }
function clear(){ ctx.beginPath(); var grd = ctx.createLinearGradient(w/2, 0, w/2, h); grd.addColorStop(0, "hsl("+(config.hueStart + npt * config.colorSpeed)+", 35%, 8%"); grd.addColorStop(1, "hsl("+(config.hueStart + npt * config.colorSpeed)+", 75%, 3%)"); ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h); ctx.closePath(); }
function drawDots(){ var avg = averageFrequency(); for(let i = 0; i < dots.length; i++){ ctx.beginPath(); var grd = ctx.createRadialGradient(dots[i].xp + dots[i].rad, dots[i].yp + dots[i].rad, 0, dots[i].xp + dots[i].rad, dots[i].yp + dots[i].rad, dots[i].rad); grd.addColorStop(0, "hsla("+(config.hueStart + npt * config.colorSpeed + dots[i].hue)+", 50%, 50%, "+(avg / 400)+"%)"); grd.addColorStop(1, "hsla("+(config.hueStart + npt * config.colorSpeed + dots[i].hue)+", 50%, 50%, 0%)"); ctx.fillStyle = grd; ctx.fillRect(dots[i].xp, dots[i].yp, dots[i].rad*2, dots[i].rad*2); ctx.closePath(); if(dots[i].xp > w || dots[i].xp < 0 || dots[i].yp > w || dots[i].yp < 0){ dots[i] = dots[dots.length-1]; dots.pop(); } else { dots[i].xp += dots[i].xv * Math.pow(avg/1000, 1.5); dots[i].yp += dots[i].yv * Math.pow(avg/1000, 1.5); } } }
function drawLines() { var avg = averageFrequency(); var maxDist = 100; for (let i = 0; i < lines.length; i++) { for (let j = 0; j < lines.length; j++) { var proDist = 100 / maxDist; var opacity = 100 - dist(lines[j].xp, lines[j].yp, lines[i].xp, lines[i].yp) * proDist; if (dist(lines[j].xp, lines[j].yp, lines[i].xp, lines[i].yp) < maxDist) { ctx.beginPath(); ctx.lineWidth = 1; ctx.strokeStyle = "hsla(" + (config.hueStart + npt * config.colorSpeed) + ", 50%, 50%, " + (opacity - 50) + "%)"; ctx.moveTo(lines[i].xp, lines[i].yp); ctx.lineTo(lines[j].xp, lines[j].yp); ctx.stroke(); ctx.closePath(); } } if (lines[i].xp > w || lines[i].xp < 0 || lines[i].yp > w || lines[i].yp < 0) { lines[i] = lines[lines.length - 1]; lines.pop(); } else { lines[i].xp += lines[i].xv * avg/500; lines[i].yp += lines[i].yv * avg/500; } } }
function getBassPulse() { if (!frequencyData) return 0; var bassSum = 0; for (let i = 0; i < 8; i++) { bassSum += frequencyData[i]; } return bassSum / 8; }
function drawSpectrum() { 
  noiseSpeed = averageFrequency(); nrt += noiseSpeed/3000000; npt += noiseSpeed/1000000; var avg = 0; 
  analyser.getByteFrequencyData(frequencyData); var noiseRotate = noise.perlin2(10, nrt); var points = Math.round(frequencyDataLen-frequencyDataLen/3); 
  var bassPower = getBassPulse(); var dynamicZoom = config.minRadius + (bassPower * 0.16); if (dynamicZoom > config.maxRadius) { dynamicZoom = config.maxRadius; }
  if (bgImage.complete) { ctx.save(); ctx.beginPath(); ctx.arc(w / 2, h / 2, dynamicZoom, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(bgImage, (w / 2) - dynamicZoom, (h / 2) - dynamicZoom, dynamicZoom * 2, dynamicZoom * 2); ctx.restore(); }
  for (let i = 0.5; i < points; i++) { 
    avg += frequencyData[i]; avg = avg / points; 
    var x1 = w / 2 + (dynamicZoom) * Math.cos(-Math.PI/2 + 2 * Math.PI * i / points + noiseRotate); 
    var y1 = h / 2 + (dynamicZoom) * Math.sin(-Math.PI/2 + 2 * Math.PI * i / points + noiseRotate); 
    var x2 = w / 2 + ((dynamicZoom) + avg * config.multiplier) * Math.cos(-Math.PI/2 + 2 * Math.PI * i / points + noiseRotate); 
    var y2 = h / 2 + ((dynamicZoom) + avg * config.multiplier) * Math.sin(-Math.PI/2 + 2 * Math.PI * i / points + noiseRotate); 
    var x3 = w / 2 + ((dynamicZoom) + Math.pow((avg * config.multiplier) * 0.09, 2)) * Math.cos(-Math.PI/2 + 2 * Math.PI * i / points + noiseRotate); 
    var y3 = h / 2 + ((dynamicZoom) + Math.pow((avg * config.multiplier) * 0.09, 2)) * Math.sin(-Math.PI/2 + 2 * Math.PI * i / points + noiseRotate); 
    var nd1 = noise.simplex2(y1/100, npt)*10; 
    ctx.beginPath(); ctx.lineCap = "round"; ctx.lineWidth = 1.5; ctx.strokeStyle = "hsla("+(config.hueStart + npt * config.colorSpeed)+", 50%, "+(20+(Math.pow(avg * 3, 2)))+"%, 100%)"; ctx.moveTo(x1+nd1, y1+nd1); ctx.lineTo(x2+nd1, y2+nd1); ctx.stroke(); ctx.closePath(); 
    ctx.beginPath(); ctx.lineCap = "round"; ctx.lineWidth = 3.5; ctx.strokeStyle = "hsla("+(config.hueStart + npt * config.colorSpeed)+", 50%, "+(30+(Math.pow(avg * 3, 2)))+"%, 100%)"; ctx.moveTo(x1+nd1, y1+nd1); ctx.lineTo(x3+nd1, y3+nd1); ctx.stroke(); ctx.closePath(); 
  } 
}
function render() { if (!playing) return; clear(); drawDots(); drawSpectrum(); drawLines(); requestAnimationFrame(render); }
function dist(x1, y1, x2, y2) { var a = x1 - x2; var b = y1 - y2; return Math.sqrt(a * a + b * b); }
function averageFrequency() { var avg = 0; for (let i = 0; i < frequencyData.length; i++) { avg += frequencyData[i]; } return avg; }
</script>
